# Where MPs Stand on a single server: the app plus Caddy for automatic HTTPS.
# Usage (from this directory): cp .env.example .env && edit, then
#   docker compose up -d --build

# Logs are capped (three files of 10 MB per container) so they never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
    env_file: .env
    logging: *logging
    volumes:
      - hansard-data:/data
      # daily backups land here on the server itself (/opt/hansardgpt/deploy/backups), easy to copy off
      - ./backups:/backups
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11.7
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:?set REDIRECT_DOMAINS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # this server's own settings for Caddy: Cloudflare's addresses and, behind Cloudflare, its certificate
      - ./local:/etc/caddy/local:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  hansard-data:
  caddy-data:
  caddy-config:
