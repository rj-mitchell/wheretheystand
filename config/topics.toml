# Topic briefings: standing questions, each with a permanent page at /topics/<slug>, kept up to date by the sync.
#
# Wording matters: each question must be neutral, name no side, and ask about positions rather than assume an
# answer. Keep the period in the question ("over the past twelve months") so each refresh covers recent debate.
#
#   slug          the page address: lower-case words joined by hyphens; never change it once published
#   title         shown on the page and in search results
#   question      what is asked each time the briefing is written
#   area          heading it is listed under on /topics
#   description   one line under the title
#   refresh_days  the least time between rewrites (default 7); a rewrite also needs new, different evidence
#
# Each rewrite costs about 11p. Sixteen topics refreshed weekly, when their evidence has changed, cost roughly
# £2 to £6 a month.

