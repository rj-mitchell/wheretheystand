# The test set: questions with the filters a careful reader would choose for each.
#
# Used by `hansard eval` to score (1) how the question is read (each filter compared with the expected one),
# (2) how relevant and balanced the chosen sources are, and (3) the briefings themselves.
#
# Every filter not listed under `expect` is expected to be empty (or "role" for group_by, false for wants_votes):
# setting a filter the question did not ask for counts as a mistake. `<field>_any` lists acceptable alternatives.
# Dates are matched within 45 days, so "the last Parliament" can end at dissolution or at the next election.
# `portfolios` are scored separately (any overlap counts), because they only boost ministers and never filter.
# The questions are read as if today were 11 October 2026.

today = "2026-10-11"

# ---- topics with no filters --------------------------------------------------------------------------------------

[[q]]
id = "wind"
question = "Where do rural and city MPs differ on onshore wind?"
category = "topic"
expect = { houses_any = [[], ["commons"]], portfolios = ["energy_climate"] }

